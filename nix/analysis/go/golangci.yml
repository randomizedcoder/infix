# golangci.yml
#
# Tier 1 (analysis-standard): tier 0 plus the security and correctness linters.

version: "2"

run:
  timeout: 10m
  modules-download-mode: vendor

linters:
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign
    - unused
    - staticcheck
    - gosec
    - gocritic
    - revive
    - noctx
    - contextcheck
    - durationcheck
    - bodyclose
    - errorlint
    - nilerr
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    staticcheck:
      checks: ["all", "-SA1019", "-ST1000", "-ST1003"]
    gosec:
      excludes:
        # Integer conversions in the netlink/zapi decoders; the fuzzers cover those.
        - G115
    gocritic:
      enabled-checks:
        - appendAssign
        - argOrder
        - badCond
        - dupCase
        - dupSubExpr
        - nilValReturn
        - sloppyLen
        - offBy1
        - weakCond
    revive:
      rules:
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: unreachable-code
  exclusions:
    rules:
      - path: "_test\\.go"
        linters: [errcheck, unused, noctx, gosec, bodyclose]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
