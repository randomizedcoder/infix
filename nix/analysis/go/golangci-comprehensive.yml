# golangci-comprehensive.yml
#
# Tier 2 (analysis-deep): every linter in tier 1 plus the slower and noisier ones.
# Findings here are leads for review, not gates.

version: "2"

run:
  timeout: 20m
  modules-download-mode: vendor

linters:
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign
    - unused
    - staticcheck
    - gosec
    - gocritic
    - revive
    - noctx
    - contextcheck
    - durationcheck
    - bodyclose
    - errorlint
    - nilerr
    - nilnil
    - forcetypeassert
    - makezero
    - prealloc
    - unparam
    - unconvert
    - wastedassign
    - exhaustive
    - gocyclo
    - dupl
    - goconst
    - misspell
    - rowserrcheck
    - sqlclosecheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks: ["all", "-SA1019"]
    gocritic:
      enabled-tags: [diagnostic, performance]
      disabled-checks: [hugeParam]
    gocyclo:
      min-complexity: 30
    misspell:
      locale: US
  exclusions:
    rules:
      - path: "_test\\.go"
        linters: [errcheck, unused, noctx, gosec, bodyclose, dupl, goconst, gocyclo, forcetypeassert]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
