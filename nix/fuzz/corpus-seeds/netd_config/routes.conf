route {
    prefix = "192.168.10.0/24"
    nexthop = "10.0.0.1"
    distance = 5
    tag = 100
}
route {
    prefix = "2001:db8::/32"
    interface = "eth0"
    source = "2001:db8:1::/48"
}
rip {
    enabled = true
    default-metric = 2
    network = { "eth0", "eth1" }
    passive = { "eth1" }
    neighbor = { "10.0.0.2" }
    redistribute = { "connected", "static" }
    system = { "vtysh -c 'show ip rip'" }
    timers { update = 30 invalid = 180 flush = 240 }
}
